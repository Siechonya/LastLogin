<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 533">
  <defs>
    <linearGradient id="deskTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20222a"/>
      <stop offset="1" stop-color="#15161c"/>
    </linearGradient>
    <radialGradient id="lampLight" cx="0.72" cy="0.06" r="0.9">
      <stop offset="0" stop-color="#cfe0f0" stop-opacity="0.2"/>
      <stop offset="0.6" stop-color="#cfe0f0" stop-opacity="0.06"/>
      <stop offset="1" stop-color="#cfe0f0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mirrorGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3242"/>
      <stop offset="0.5" stop-color="#1d2432"/>
      <stop offset="1" stop-color="#161c29"/>
    </linearGradient>
    <radialGradient id="vig" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.45" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.58"/>
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>
  <rect width="800" height="533" fill="url(#deskTop)"/>
  <rect width="800" height="533" fill="url(#lampLight)"/>
  <path d="M800 0 L640 0 L800 300 z" fill="#cfe0f0" opacity="0.04"/>
  <g>
    <rect x="640" y="34" width="146" height="416" rx="10" fill="#2a2c33"/>
    <rect x="650" y="44" width="126" height="396" rx="6" fill="url(#mirrorGlass)"/>
    <g filter="url(#soft)" opacity="0.42">
      <circle cx="706" cy="188" r="16" fill="#0a0d14"/>
      <path d="M684 216 q22 -12 44 0 l8 96 q-30 12 -60 0 z" fill="#0a0d14"/>
      <path d="M726 214 q22 6 24 26 l-6 8 l-22 -18 z" fill="#0a0d14"/>
      <rect x="742" y="222" width="14" height="24" rx="2" fill="#39414f" transform="rotate(14 749 234)"/>
    </g>
    <path d="M656 60 l60 -12 l-60 120 z" fill="#dfe8f5" opacity="0.06"/>
    <rect x="650" y="44" width="126" height="396" rx="6" fill="none" stroke="#3a3d47" stroke-width="2"/>
  </g>
  <g>
    <ellipse cx="118" cy="492" rx="52" ry="20" fill="#4a3a44" transform="rotate(-12 118 492)"/>
    <path d="M74 470 q30 -26 66 -16 q22 6 24 18 q-30 -14 -54 -2 q-20 10 -22 20 q-14 -8 -14 -20 z" fill="#5c4a52" transform="rotate(-12 118 482)"/>
    <ellipse cx="118" cy="496" rx="44" ry="13" fill="#33262e" opacity="0.7" transform="rotate(-12 118 496)"/>
  </g>
  <rect x="196" y="60" width="370" height="452" fill="#05060a" opacity="0.6" filter="url(#shadow)" transform="rotate(-1.5 380 286)"/>
  <g transform="rotate(-1.5 380 286)">
    <rect x="188" y="48" width="370" height="452" fill="#d9dade"/>
    <rect x="188" y="48" width="370" height="452" fill="url(#lampLight)" opacity="0.6"/>
    <g font-family="sans-serif" fill="#1b2130">
      <text x="230" y="146" font-size="30" fill="#1b2130">林晚：</text>
      <text x="230" y="226" font-size="26" fill="#1b2130">停止你正在做的事。</text>
      <text x="230" y="270" font-size="26" fill="#1b2130">有些数字不属于你。</text>
      <text x="230" y="348" font-size="26" fill="#1b2130">聪明人知道什么时候停手。</text>
    </g>
    <path d="M230 384 h120" stroke="#1b2130" stroke-width="1" opacity="0.25"/>
  </g>
  <rect width="800" height="533" fill="url(#vig)"/>
  <rect width="800" height="533" filter="url(#grain)" opacity="0.09"/>
</svg>
